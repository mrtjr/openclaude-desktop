<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>OpenClaude</title>
  <meta name="theme-color" content="#0f0f10" />
  <!-- iOS standalone (vira "app" ao Adicionar à Tela de Início) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OpenClaude" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span id="dot" class="dot" title="Conexão"></span>
        <span class="title">OpenClaude</span>
      </div>
      <div class="meta">
        <span id="model" class="badge">—</span>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">⋯</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <div class="empty-logo">◈</div>
        <p class="empty-title">Conectado ao seu desktop</p>
        <p class="empty-sub">Converse com a IA local e a principal do seu PC, de qualquer rede.</p>
      </div>
    </main>

    <div id="typing" class="typing hidden"><span></span><span></span><span></span></div>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" placeholder="Escreva uma mensagem…" autocomplete="off"></textarea>
      <button id="send" class="send" type="submit" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.39 10l12.6 2-12.6 2z"/></svg>
      </button>
    </form>
  </div>

  <!-- Tela de pareamento (quando não há token válido) -->
  <div id="pair" class="pair hidden">
    <div class="pair-card">
      <div class="empty-logo">◈</div>
      <h1>Parear com o desktop</h1>
      <p>No app do PC, abra <b>Conectar celular</b> e escaneie o QR ou cole o código de pareamento aqui.</p>
      <input id="pairToken" type="text" inputmode="text" placeholder="Cole o código de pareamento" autocomplete="off" />
      <button id="pairBtn" class="primary">Conectar</button>
      <p id="pairErr" class="pair-err"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
