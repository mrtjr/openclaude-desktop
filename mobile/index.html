<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>OpenClaude</title>
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OpenClaude" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span id="dot" class="dot" title="Conexão"></span>
        <span class="title">OpenClaude</span>
      </div>
      <div class="meta">
        <button id="modelBtn" class="model-pill" aria-label="Trocar modelo">
          <span id="model">—</span>
          <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <div class="empty-logo">◈</div>
        <p class="empty-title">Conectado ao seu desktop</p>
        <p class="empty-sub">Converse com a IA local e a principal do seu PC — de qualquer rede.</p>
      </div>
    </main>

    <div id="typing" class="typing hidden"><span></span><span></span><span></span></div>

    <form id="composer" class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Mensagem…" autocomplete="off" enterkeyhint="send"></textarea>
        <button id="send" class="send" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.39 10l12.6 2-12.6 2z"/></svg>
        </button>
      </div>
    </form>
  </div>

  <!-- Bottom sheet: modelo + ações -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <div class="sheet-section-title">Modelo</div>
      <div id="targets" class="targets"></div>
      <div class="sheet-actions">
        <button id="clearBtn" class="sheet-btn">Limpar conversa</button>
        <button id="repairBtn" class="sheet-btn danger">Reparear (esquecer este PC)</button>
      </div>
    </div>
  </div>

  <!-- Tela de pareamento -->
  <div id="pair" class="pair hidden">
    <div class="pair-card">
      <div class="empty-logo">◈</div>
      <h1>Parear com o desktop</h1>
      <p>No app do PC, abra <b>Configurações → Celular</b> e escaneie o QR. Ou cole o código de pareamento aqui.</p>
      <input id="pairToken" type="text" inputmode="text" placeholder="Cole o código de pareamento" autocomplete="off" />
      <button id="pairBtn" class="primary">Conectar</button>
      <p id="pairErr" class="pair-err"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
