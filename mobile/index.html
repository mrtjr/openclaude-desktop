<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>OpenClaude</title>
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OpenClaude" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Conversas" title="Conversas">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button id="modelBtn" class="model-pill" aria-label="Trocar modelo">
        <span id="dot" class="dot" title="Conexão"></span>
        <span id="model">—</span>
        <svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
      </button>
      <button id="newChatBtn" class="icon-btn" aria-label="Nova conversa" title="Nova conversa">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <main id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <div class="empty-logo">◈</div>
        <p class="empty-title">Como posso ajudar?</p>
        <p class="empty-sub">Sua IA local e a principal do desktop — de qualquer lugar.</p>
        <div id="chips" class="chips">
          <button class="chip">Resuma esta ideia: </button>
          <button class="chip">Escreva um e-mail para </button>
          <button class="chip">Me explique como </button>
          <button class="chip">Crie um plano para </button>
        </div>
      </div>
    </main>

    <button id="scrollBtn" class="scroll-btn hidden" aria-label="Ir para o fim">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 16l-6-6h12z"/></svg>
    </button>

    <div id="typing" class="typing hidden">
      <span class="dots"><span></span><span></span><span></span></span>
      <span id="elapsed" class="elapsed"></span>
    </div>

    <form id="composer" class="composer">
      <div class="composer-box">
        <button id="micBtn" class="mic hidden" type="button" aria-label="Falar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path fill="none" stroke="currentColor" stroke-width="2" d="M6 11a6 6 0 0 0 12 0M12 17v3"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Mensagem…" autocomplete="off" enterkeyhint="send"></textarea>
        <button id="send" class="send" type="submit" aria-label="Enviar">
          <svg class="ic-send" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.39 10l12.6 2-12.6 2z"/></svg>
          <svg class="ic-stop hidden" viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
    </form>
  </div>

  <div id="drawer" class="drawer hidden">
    <div class="drawer-backdrop"></div>
    <div class="drawer-panel">
      <div class="drawer-head">
        <span class="drawer-title">Conversas</span>
        <button id="drawerNew" class="drawer-new">+ Nova</button>
      </div>
      <input id="convSearch" class="conv-search" type="search" placeholder="Buscar conversas…" autocomplete="off" />
      <div id="convList" class="conv-list"></div>
    </div>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop"></div>
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <div class="sheet-section-title">Modelo</div>
      <div id="targets" class="targets"></div>
      <div class="sheet-actions">
        <button id="shareBtn" class="sheet-btn">Compartilhar conversa</button>
        <button id="themeBtn" class="sheet-btn">Tema: escuro</button>
        <button id="clearBtn" class="sheet-btn">Limpar conversa</button>
        <button id="repairBtn" class="sheet-btn danger">Reparear (esquecer este PC)</button>
      </div>
    </div>
  </div>

  <div id="pair" class="pair hidden">
    <div class="pair-card">
      <div class="empty-logo">◈</div>
      <h1>Parear com o desktop</h1>
      <p>No app do PC, abra <b>Configurações → Celular</b> e escaneie o QR. Ou cole o código de pareamento aqui.</p>
      <input id="pairToken" type="text" inputmode="text" placeholder="Cole o código de pareamento" autocomplete="off" />
      <button id="pairBtn" class="primary">Conectar</button>
      <p id="pairErr" class="pair-err"></p>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
